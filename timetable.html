<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sam's Timetable</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0f11;
    --surface: #16181c;
    --surface2: #1d1f25;
    --border: rgba(255,255,255,0.07);
    --text: #e8eaf0;
    --muted: #6b7280;
    --accent: #6366f1;
    --accent-dim: rgba(99,102,241,0.15);
    --done: #22c55e;
    --done-dim: rgba(34,197,94,0.12);
    --current: #f59e0b;
    --current-dim: rgba(245,158,11,0.15);
    --upcoming: #3b82f6;
    --upcoming-dim: rgba(59,130,246,0.1);
    --free: #374151;
    --free-dim: rgba(55,65,81,0.3);
    --radius: 12px;
    --font: 'Inter', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  body.light {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface2: #f0f0f5;
    --border: rgba(0,0,0,0.08);
    --text: #111827;
    --muted: #6b7280;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    transition: background 0.25s, color 0.25s;
  }

  /* LAYOUT */
  .shell { display: flex; min-height: 100vh; }

  /* SIDEBAR */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 24px 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .sidebar-brand {
    padding: 0 20px 24px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-brand .icon { font-size: 26px; margin-bottom: 6px; display: block; }
  .sidebar-brand h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; color: var(--text); }
  .sidebar-brand p { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: var(--mono); }

  .sidebar-nav { padding: 16px 12px; flex: 1; }
  .sidebar-nav label {
    display: block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--muted);
    padding: 0 8px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 12px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: var(--font);
    font-size: 13.5px;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    text-align: left;
    margin-bottom: 2px;
  }
  .nav-btn:hover { background: var(--surface2); color: var(--text); }
  .nav-btn.active { background: var(--accent-dim); color: var(--accent); }
  .nav-btn .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; flex-shrink: 0;
  }

  .sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
  }
  .theme-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
  }
  .toggle-track {
    width: 36px; height: 20px;
    background: var(--border);
    border-radius: 10px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    border: none;
    flex-shrink: 0;
  }
  .toggle-track.on { background: var(--accent); }
  .toggle-thumb {
    position: absolute;
    top: 3px; left: 3px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s;
  }
  .toggle-track.on .toggle-thumb { transform: translateX(16px); }

  /* MAIN */
  .main { flex: 1; padding: 32px 36px; max-width: 760px; }

  .page-header {
    margin-bottom: 28px;
  }
  .day-label {
    font-size: 11px;
    font-family: var(--mono);
    color: var(--accent);
    margin-bottom: 6px;
    display: block;
  }
  .page-header h2 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .page-header .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* TIMETABLE VIEW TOGGLE */
  .view-pills {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 4px;
    border-radius: 10px;
    width: fit-content;
  }
  .pill {
    padding: 7px 16px;
    border-radius: 7px;
    border: none;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    background: transparent;
    color: var(--muted);
    transition: background 0.15s, color 0.15s;
  }
  .pill.active { background: var(--accent); color: #fff; }

  /* CLASS CARDS */
  .class-list { display: flex; flex-direction: column; gap: 8px; }

  .class-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 0 16px;
    align-items: start;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .class-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    border-radius: 3px 0 0 3px;
  }

  .class-card.status-done::before { background: var(--done); }
  .class-card.status-current::before { background: var(--current); }
  .class-card.status-upcoming::before { background: var(--upcoming); }
  .class-card.status-free::before { background: var(--free); }

  .class-card.status-current {
    background: color-mix(in srgb, var(--surface) 85%, var(--current) 15%);
    border-color: rgba(245,158,11,0.25);
  }

  .time-col {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    padding-top: 2px;
    line-height: 1.6;
  }
  .time-col .start { color: var(--text); font-weight: 500; }

  .info-col {}
  .class-name {
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.01em;
    margin-bottom: 3px;
  }
  .class-meta {
    font-size: 12px;
    color: var(--muted);
  }
  .class-meta span + span::before { content: ' · '; }

  .badge {
    display: inline-flex;
    align-items: center;
    font-size: 10px;
    font-family: var(--mono);
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 4px;
    float: right;
    margin-top: 1px;
  }
  .badge-done { background: var(--done-dim); color: var(--done); }
  .badge-current { background: var(--current-dim); color: var(--current); }
  .badge-upcoming { background: var(--upcoming-dim); color: var(--upcoming); }
  .badge-free { background: var(--free-dim); color: var(--muted); }

  /* PROGRESS BAR */
  .progress-bar {
    margin-top: 10px;
    grid-column: 1 / -1;
  }
  .prog-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 5px;
    font-family: var(--mono);
  }
  .prog-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .prog-fill {
    height: 100%;
    background: var(--current);
    border-radius: 2px;
    transition: width 0.5s ease;
  }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }

  /* RESPONSIVE */
  @media (max-width: 640px) {
    .sidebar { width: 100%; height: auto; flex-direction: row; padding: 12px 16px; position: static; border-right: none; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .sidebar-brand { padding: 0; border: none; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .sidebar-brand .icon { margin: 0; font-size: 20px; }
    .sidebar-brand p { display: none; }
    .sidebar-nav { padding: 0 12px; display: flex; align-items: center; gap: 4px; }
    .sidebar-nav label { display: none; }
    .sidebar-footer { padding: 0; margin-left: auto; display: flex; align-items: center; }
    .shell { flex-direction: column; }
    .main { padding: 20px 16px; max-width: none; }
    .class-card { grid-template-columns: 76px 1fr; }
  }
</style>
</head>

</div>

const FREE_SUBJECTS = ['Break','Lunch','Early Half Day','End of Day'];

let currentView = 'today';   // 'today' | 'week-new' | 'week-old'
let activeTT = 'new';        // 'new' | 'old'
let lightMode = false;

function parseTime(str) {
  const [h, m] = str.split(':').map(Number);
  const d = new Date();
  d.setHours(h, m, 0, 0);
  return d;
}

function getStatus(start, end) {
  const now = new Date();
  const s = parseTime(start), e = parseTime(end);
  if (now > e) return 'done';
  if (now >= s) return 'current';
  return 'upcoming';
}

function isFree(subject) { return FREE_SUBJECTS.includes(subject); }

function buildCard(item, showStatus) {
  const free = isFree(item.Subject);
  let status = 'upcoming';
  if (free) status = 'free';
  else if (showStatus) status = getStatus(item.Start, item.End);

  const badgeLabel = { done:'done', current:'now', upcoming:'next', free:'' }[status];
  const badgeHtml = badgeLabel
    ? `<span class="badge badge-${status}">${badgeLabel}</span>`
    : '';

  let progressHtml = '';
  if (status === 'current' && showStatus) {
    const s = parseTime(item.Start), e = parseTime(item.End), now = new Date();
    const pct = Math.round(((now - s) / (e - s)) * 100);
    const minsLeft = Math.ceil((e - now) / 60000);
    progressHtml = `
      <div class="progress-bar" style="grid-column:1/-1">
        <div class="prog-row"><span>${minsLeft} min left</span><span>${pct}%</span></div>
        <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
      </div>`;
  }

  const meta = [item.Teacher, item.Room].filter(Boolean);
  const metaHtml = meta.length
    ? `<div class="class-meta">${meta.map(m => `<span>${m}</span>`).join('')}</div>`
    : '';

  return `
    <div class="class-card status-${status}">
      <div class="time-col">
        <span class="start">${item.Start}</span><br>${item.End}
      </div>
      <div class="info-col">
        ${badgeHtml}
        <div class="class-name">${item.Subject}</div>
        ${metaHtml}
      </div>
      ${progressHtml}
    </div>`;
}

function buildWeekView(tt) {
  const weekDays = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
  let html = '';
  for (const day of weekDays) {
    const items = tt.filter(i => i.Day === day);
    html += `<div style="margin-bottom:28px">
      <div style="font-size:12px;font-family:var(--mono);color:var(--accent);margin-bottom:10px;font-weight:500">${day.toUpperCase()}</div>
      <div class="class-list">${items.map(i => buildCard(i, false)).join('')}</div>
    </div>`;
  }
  return html;
}

function render() {
  const dayName = DAYS[new Date().getDay()];
  const isWeekday = dayName !== 'Saturday' && dayName !== 'Sunday';
  const dateStr = new Date().toLocaleDateString('en-IE', {weekday:'long',day:'numeric',month:'long'});

  const switcher = document.getElementById('tt-switcher');
  const list = document.getElementById('class-list');
  const title = document.getElementById('main-title');
  const subtitle = document.getElementById('main-subtitle');
  const dayLabel = document.getElementById('day-label');

  dayLabel.textContent = dateStr.toUpperCase();

  if (currentView === 'today') {
    switcher.style.display = 'flex';
    const tt = activeTT === 'new' ? TT_NEW : TT_OLD;
    title.textContent = "Today's Classes";
    subtitle.textContent = activeTT === 'new' ? 'Current timetable · 2M' : 'Previous timetable';

    if (!isWeekday) {
      list.innerHTML = '<div class="empty">No school today. Enjoy your weekend 🎉</div>';
      return;
    }

    const todayItems = tt.filter(i => i.Day === dayName);
    if (!todayItems.length) {
      list.innerHTML = '<div class="empty">Nothing scheduled for today.</div>';
      return;
    }
    list.innerHTML = todayItems.map(i => buildCard(i, true)).join('');

  } else if (currentView === 'week-new') {
    switcher.style.display = 'none';
    title.textContent = 'Full Week · 2M';
    subtitle.textContent = 'Current timetable';
    list.innerHTML = buildWeekView(TT_NEW);

  } else {
    switcher.style.display = 'none';
    title.textContent = 'Full Week · Previous';
    subtitle.textContent = 'Old timetable for reference';
    list.innerHTML = buildWeekView(TT_OLD);
  }
}

function switchView(v) {
  currentView = v;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-' + v).classList.add('active');
  render();
}

function setActiveTT(t) {
  activeTT = t;
  document.getElementById('pill-new').classList.toggle('active', t === 'new');
  document.getElementById('pill-old').classList.toggle('active', t === 'old');
  render();
}

function toggleTheme() {
  lightMode = !lightMode;
  document.body.classList.toggle('light', lightMode);
  document.getElementById('theme-btn').classList.toggle('on', lightMode);
  localStorage.setItem('theme', lightMode ? 'light' : 'dark');
}

// Init
const savedTheme = localStorage.getItem('theme');
if (savedTheme === 'light') {
  lightMode = true;
  document.body.classList.add('light');
  document.getElementById('theme-btn').classList.add('on');
}

render();
setInterval(render, 30000);
</script>
</body>
</html>
