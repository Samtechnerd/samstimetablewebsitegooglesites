<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Widget</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0f11;
    --surface: #16181c;
    --border: rgba(255,255,255,0.07);
    --text: #e8eaf0;
    --muted: #6b7280;
    --green: #22c55e;
    --amber: #f59e0b;
    --blue: #6366f1;
    --mono: 'JetBrains Mono', monospace;
    --font: 'Inter', sans-serif;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    font-family: var(--font);
    overflow: hidden;
  }

  #widget {
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    border-left: 3px solid var(--muted);
    transition: border-color 0.4s;
    position: relative;
  }

  #widget.active  { border-left-color: var(--amber); }
  #widget.next    { border-left-color: var(--blue); }
  #widget.done    { border-left-color: #374151; }

  /* TT SWITCHER */
  .tt-bar {
    display: flex;
    gap: 0;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
  }
  .tt-btn {
    flex: 1;
    padding: 5px 0;
    border: none;
    background: transparent;
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    text-transform: uppercase;
  }
  .tt-btn.active { background: rgba(99,102,241,0.15); color: var(--blue); }

  /* HEADER */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px 6px;
    flex-shrink: 0;
  }
  .status-label {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .end-time {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }

  /* MAIN */
  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 4px 14px 10px;
    min-height: 0;
  }

  .subject {
    font-size: clamp(1.1rem, 4vw, 1.6rem);
    font-weight: 800;
    color: var(--text);
    line-height: 1.1;
    letter-spacing: -0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .detail-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-top: 4px;
    flex-wrap: wrap;
  }
  .room {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    background: rgba(255,255,255,0.05);
    padding: 1px 6px;
    border-radius: 4px;
  }
  .time-detail {
    font-size: 12px;
    font-weight: 600;
  }
  .teacher {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* PROGRESS */
  .prog-wrap { margin-top: 10px; }
  .prog-info {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .prog-track {
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
  }
  .prog-fill {
    height: 100%;
    background: var(--amber);
    border-radius: 2px;
    transition: width 1s linear;
  }

  /* FOOTER */
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 12px;
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.2);
    flex-shrink: 0;
  }
  .next-label {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    margin-right: 6px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .next-subject {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
  }
  .next-time {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }

  .center-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    padding: 12px;
    text-align: center;
  }
  .center-state .big { font-size: 1.4rem; font-weight: 700; color: #374151; margin-bottom: 4px; }
  .center-state .small { font-size: 11px; font-family: var(--mono); }
</style>
</head>

let activeTT = 'new';

function pt(str) {
  const [h, m] = str.split(':').map(Number);
  const d = new Date();
  d.setHours(h, m, 0, 0);
  return d;
}

function dayName() {
  return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()];
}

function render() {
  const now = new Date();
  const tt = activeTT === 'new' ? TT_NEW : TT_OLD;
  const day = dayName();
  const w = document.getElementById('widget');

  const todayItems = tt.filter(i => i.Day === day).sort((a,b) => pt(a.Start) - pt(b.Start));

  const cur = todayItems.find(i => now >= pt(i.Start) && now < pt(i.End));
  const nxt = todayItems.find(i => pt(i.Start) > now);

  const ttBar = `
    <div class="tt-bar">
      <button class="tt-btn ${activeTT==='new'?'active':''}" onclick="setTT('new')">2M · Current</button>
      <button class="tt-btn ${activeTT==='old'?'active':''}" onclick="setTT('old')">Previous</button>
    </div>`;

  const footerHtml = (nxt) => `
    <div class="footer">
      <div><span class="next-label">Next</span><span class="next-subject">${nxt ? nxt.Subject : 'End of day'}</span></div>
      <span class="next-time">${nxt ? nxt.Start : ''}</span>
    </div>`;

  if (cur) {
    const s = pt(cur.Start), e = pt(cur.End);
    const pct = Math.min(100, Math.max(0, ((now - s) / (e - s)) * 100));
    const minsLeft = Math.ceil((e - now) / 60000);
    w.className = 'active';
    w.innerHTML = ttBar + `
      <div class="header">
        <span class="status-label" style="color:var(--amber)">Now</span>
        <span class="end-time">ends ${cur.End}</span>
      </div>
      <div class="body">
        <div class="subject">${cur.Subject}</div>
        <div class="detail-row">
          ${cur.Room ? `<span class="room">${cur.Room}</span>` : ''}
          <span class="time-detail" style="color:var(--amber)">${minsLeft} min left</span>
        </div>
        ${cur.Teacher ? `<div class="teacher">${cur.Teacher}</div>` : ''}
        <div class="prog-wrap">
          <div class="prog-info"><span>${Math.round(pct)}%</span><span>${cur.Start} → ${cur.End}</span></div>
          <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
        </div>
      </div>
      ${footerHtml(nxt)}`;
  } else if (nxt) {
    const s = pt(nxt.Start);
    const diff = Math.ceil((s - now) / 60000);
    const timeStr = diff > 60 ? `at ${nxt.Start}` : `in ${diff} min`;
    w.className = 'next';
    w.innerHTML = ttBar + `
      <div class="header">
        <span class="status-label" style="color:var(--blue)">Up next</span>
        <span class="end-time">${nxt.Start}</span>
      </div>
      <div class="body">
        <div class="subject">${nxt.Subject}</div>
        <div class="detail-row">
          ${nxt.Room ? `<span class="room">${nxt.Room}</span>` : ''}
          <span class="time-detail" style="color:var(--blue)">${timeStr}</span>
        </div>
        ${nxt.Teacher ? `<div class="teacher">${nxt.Teacher}</div>` : ''}
      </div>`;
  } else {
    w.className = 'done';
    w.innerHTML = ttBar + `
      <div class="center-state">
        <div class="big">Done</div>
        <div class="small">No more classes today</div>
      </div>`;
  }
}

function setTT(t) {
  activeTT = t;
  render();
}

render();
